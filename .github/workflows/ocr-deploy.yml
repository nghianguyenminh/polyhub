name: Deploy OCR Service to Hugging Face Spaces

on:
  push:
    branches: [dev]
    paths:
      - 'ocr-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Subdirectory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          # Cấu hình thông tin Git bot
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Di chuyển vào thư mục ocr-service và khởi tạo git tạm thời
          cd ocr-service
          git init -b main
          git add .
          git commit -m "Deploy latest ocr-service from GitHub monorepo"
          
          # Push đè lên Hugging Face Space của bạn
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/polyhub-ocr-service main
