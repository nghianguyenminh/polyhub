<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main_layout :: layout(~{this :: myCss}, ~{this :: myContent}, 'videos')}">

<head>
    <meta charset="UTF-8">
    <title>PolyHUB Reels</title>
    <th:block th:fragment="myCss">
        <link rel="stylesheet" th:href="@{/client/css/home.css}">
        <link rel="stylesheet" th:href="@{/client/css/video-player.css}">
    </th:block>
</head>

<body>
    <div th:fragment="myContent" class="reels-container">
        <div class="reel-item shadow-lg">
            <div class="video-wrapper">
                <video class="main-video-player" loop>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>

                <div class="reel-overlay-info p-3">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <img src="https://i.pravatar.cc/150?u=student1" class="rounded-circle border border-2 border-white" width="40" height="40">
                        <div class="text-white">
                            <h6 class="mb-0 fw-bold shadow-text">Nguyễn Minh Nghĩa</h6>
                            <small class="opacity-75">Ngành Thiết kế đồ họa</small>
                        </div>
                        <button class="btn btn-sm btn-outline-light ms-2 px-3 rounded-pill">Theo dõi</button>
                    </div>
                    <p class="text-white mb-0 reel-caption">Fix lỗi Mesh bị vỡ cực nhanh trong Unity #UnityTips #PolyHUB</p>
                </div>

                <div class="reel-actions-sidebar">
                    <div class="action-item">
                        <button class="btn-reel-action btn-like"><i class="bi bi-heart-fill"></i></button>
                        <span>1.2k</span>
                    </div>
                    <div class="action-item">
                        <button class="btn-reel-action"><i class="bi bi-chat-dots-fill"></i></button>
                        <span>45</span>
                    </div>
                    <div class="action-item">
                        <button class="btn-reel-action"><i class="bi bi-share-fill"></i></button>
                        <span>Gửi</span>
                    </div>
                    <div class="action-item">
                        <button class="btn-reel-action"><i class="bi bi-three-dots"></i></button>
                    </div>
                </div>

                <div class="reel-bottom-controls">
                    <div class="progress-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <div class="d-flex justify-content-between px-3 pb-2">
                        <button class="btn-play-pause btn btn-link text-white p-0 border-0"><i class="bi bi-play-fill fs-4"></i></button>
                        <button class="btn-mute btn btn-link text-white p-0 border-0"><i class="bi bi-volume-up-fill fs-4"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="reel-item shadow-lg">
            <div class="video-wrapper">
                <video class="main-video-player" loop>
                    <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
                </video>
                <div class="reel-overlay-info p-3">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <img src="https://i.pravatar.cc/150?u=student2" class="rounded-circle border border-2 border-white" width="40" height="40">
                        <div class="text-white">
                            <h6 class="mb-0 fw-bold shadow-text">Lưu Phan Bảo Châu</h6>
                            <small class="opacity-75">Ngành Full-stack Dev</small>
                        </div>
                    </div>
                    <p class="text-white mb-0 reel-caption">Demo giao diện PolyHUB mới 🚀✨</p>
                </div>
                <div class="reel-actions-sidebar">
                    <div class="action-item"><button class="btn-reel-action btn-like"><i class="bi bi-heart-fill"></i></button><span>850</span></div>
                    <div class="action-item"><button class="btn-reel-action"><i class="bi bi-chat-dots-fill"></i></button><span>12</span></div>
                    <div class="action-item"><button class="btn-reel-action"><i class="bi bi-share-fill"></i></button><span>Gửi</span></div>
                </div>
                <div class="reel-bottom-controls">
                    <div class="progress-container"><div class="progress-bar-fill"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/client/js/video-controller.js}"></script>
</body>
</html>
