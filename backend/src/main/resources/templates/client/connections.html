<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/main_layout :: layout(~{this :: myCss}, ~{this :: myContent}, 'connections')}">
<head>
    <title>Góc Kết nối - PolyHUB</title>
    <th:block th:fragment="myCss">
        <link rel="stylesheet" th:href="@{/client/css/mentors.css}">
    </th:block>
</head>
<body>
    <div th:fragment="myContent" class="poly-main-feed" style="max-width: 850px;">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="poly-card p-3 mb-4" style="background: linear-gradient(to right, #ffffff, #f0f7ff);">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h5 class="fw-bold mb-1 text-dark">Góc Kết nối PolyHUB</h5>
                    <div class="text-muted" style="font-size: 13px;">Giao lưu, theo dõi và kết bạn với mọi người trong hệ thống</div>
                </div>
            </div>
            <form action="/connections" method="get" class="input-group mt-3 shadow-sm" style="border-radius: 50rem; border: 1px solid rgba(8, 102, 255, 0.2); background: white;">
                <span class="input-group-text bg-transparent border-0 text-primary ps-3 pe-2 py-2">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" name="keyword" th:value="${keyword}" class="form-control bg-transparent border-0 py-2 shadow-none" style="font-size: 13.5px;" placeholder="Tìm kiếm người dùng theo tên, email...">
                <button type="submit" class="btn btn-primary px-4 fw-bold py-2" style="border-radius: 0 50rem 50rem 0; font-size: 13.5px;">Tìm kiếm</button>
            </form>
        </div>
        <div class="row row-cols-1 row-cols-md-2 g-3 mb-5">
            <div class="col" th:each="user : ${users}">
                <div class="mentor-profile-card">
                    <div class="mentor-card-cover" style="background-image: url('https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=600');"></div>
                    <div class="mentor-card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <img th:src="${user.avatar != null && user.avatar != 'default.png' ? user.avatar : 'https://ui-avatars.com/api/?name=' + user.fullname + '&background=random&rounded=true&size=128'}" class="mentor-card-avatar">
                            <form th:if="${currentUser != null && user.username != currentUser.username}" th:action="@{/connections/follow}" method="post" class="m-0">
                                <input type="hidden" name="targetUsername" th:value="${user.username}" />
                                <input type="hidden" name="redirect" value="/connections" />
                                <button type="submit" class="btn btn-sm rounded-pill fw-bold" 
                                        th:classappend="${user.followers != null && #lists.contains(user.followers.![username], currentUser.username)} ? 'btn-primary' : 'btn-outline-primary'" 
                                        style="font-size: 12px; margin-top: 10px;">
                                    <i class="bi me-1" th:classappend="${user.followers != null && #lists.contains(user.followers.![username], currentUser.username)} ? 'bi-person-check-fill' : 'bi-person-plus-fill'"></i>
                                    <span th:text="${user.followers != null && #lists.contains(user.followers.![username], currentUser.username)} ? 'Đang theo dõi' : 'Theo dõi'"></span>
                                </button>
                            </form>
                        </div>
                        <div class="mt-2 mb-3">
                            <h5 class="fw-bold text-dark mb-0 d-flex align-items-center">
                                <span th:text="${user.fullname}">N/A</span>
                            </h5>
                            <div class="text-muted" style="font-size: 13px; font-weight: 500;">
                                <span th:if="${user.role != null}" th:text="${user.role.name}" class="badge bg-poly-soft text-poly" style="margin-right: 5px;">Vai trò</span>
                                <span th:text="${user.email}">Email</span>
                            </div>
                        </div>
                        <p class="mentor-bio" th:text="${'Thành viên của cộng đồng PolyHUB. Luôn sẵn sàng chia sẻ và kết nối.'}"></p>
                        <div class="d-flex gap-2 mt-auto">
                            <a th:href="@{'/profile?username=' + ${user.username}}" class="btn btn-light flex-grow-1 rounded-pill fw-bold text-dark border shadow-sm btn-action">Hồ sơ</a>
                            <a th:href="@{/chat(userId=${user.username})}" class="btn btn-primary flex-grow-1 rounded-pill fw-bold btn-action text-white text-decoration-none">
                                <i class="bi bi-chat-dots-fill me-1"></i> Nhắn tin
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
