<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="admin-header d-flex align-items-center justify-content-between px-4">
        
        <div class="d-flex align-items-center gap-4">
            <button class="btn btn-link text-dark p-0 border-0 btn-toggle-sidebar shadow-none" id="sidebarToggle">
                <i class="bi bi-list fs-3 text-muted"></i>
            </button>
            
            <div class="input-group header-search-bar d-none d-md-flex px-2 py-1">
                <span class="input-group-text bg-transparent border-0 text-muted pe-1"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control bg-transparent border-0 shadow-none" placeholder="Tìm kiếm nhanh...">
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-light border-0 position-relative rounded-circle text-muted" style="width: 40px; height: 40px; background: #F3F4F6;">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-white rounded-circle" style="margin-top: 8px; margin-left: -8px;"></span>
            </button>
            
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="adminDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=4F46E5&color=fff" alt="Admin" width="36" height="36" class="rounded-circle me-2">
                    <div class="d-none d-md-block" style="line-height: 1.2;">
                        <div class="fw-bold" style="font-size: 13.5px; color: #111827;">Hệ thống Admin</div>
                        <div class="text-muted" style="font-size: 11px;">Quản trị viên cấp cao</div>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2 rounded-3" aria-labelledby="adminDropdown">
                    <li><a class="dropdown-item py-2 fw-medium text-secondary" href="#"><i class="bi bi-person-gear me-2"></i> Cài đặt tài khoản</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 fw-medium text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a></li>
                </ul>
            </div>
        </div>

    </header>
</body>
</html>
