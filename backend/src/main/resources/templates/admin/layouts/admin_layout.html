<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(customCss, content, customJs, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyHUB Admin Control Panel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/admin/css/style.css}">
    <link rel="stylesheet" th:href="@{/admin/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/admin/css/components.css}">
    
    <th:block th:replace="${customCss} ?: ~{}"></th:block>
</head>
<body class="admin-body">
    
    <div class="admin-wrapper d-flex">
        
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeMenu=${activeMenu})}"></div>

        <div class="admin-main flex-grow-1 d-flex flex-column" style="min-width: 0; min-height: 100vh;">
            
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <main class="admin-content p-4 flex-grow-1" style="background-color: var(--admin-bg);">
                <div th:replace="${content} ?: ~{}"></div>
            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/admin/js/main.js}"></script>
    
    <th:block th:replace="${customJs} ?: ~{}"></th:block>
</body>
</html>
