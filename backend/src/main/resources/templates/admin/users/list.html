<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/admin/layouts/main_layout :: layout(~{this :: myContent})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
</head>
<body>
<div th:fragment="myContent">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Quản lý người dùng</h2>
        <a th:href="@{/admin/users/add}" class="btn btn-primary btn-poly">Thêm người dùng mới</a>
    </div>

    <div class="poly-card card">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Tên đăng nhập</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.fullname}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role.name}"></td>
                    <td>
                        <span th:if="${user.active}" class="badge bg-success">Hoạt động</span>
                        <span th:if="${!user.active}" class="badge bg-danger">Bị khóa</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/users/edit/{username}(username=${user.username})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                        <a th:href="@{/admin/users/delete/{username}(username=${user.username})}" class="btn btn-sm btn-outline-danger">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
