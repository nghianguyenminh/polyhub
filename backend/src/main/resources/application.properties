spring.application.name=polyhub
# Tự động load file application-local.properties (gitignored) để đọc secret keys
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/polyhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://user:pass@localhost/polyhub_chat}
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://user:pass@localhost/polyhub_chat}

server.port=8080

# Cấu hình giới hạn kích thước file tải lên (Fix lỗi MaxUploadSizeExceededException)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api_key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your-api-secret}

# Gemini AI Configuration
# Đặt API key thực vào file .env / application-local.properties (đã gitignore)
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent

# Email Sender Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.main.allow-bean-definition-overriding=true

# FPT AI Marketplace Configuration (thay thế FPT.AI Console đã ngừng hoạt động 06/07/2026)
# Dùng Qwen2.5-VL-7B-Instruct để OCR CCCD + Liveness/FaceMatch qua endpoint chat/completions
# Đặt giá trị thật trong application-local.properties, để "mock" ở đây sẽ tự chạy chế độ giả lập demo
fpt.ai.marketplace.api-key=${FPT_MARKETPLACE_API_KEY:mock}
fpt.ai.marketplace.url=https://mkp-api.fptcloud.com/chat/completions
fpt.ai.marketplace.model=Qwen2.5-VL-7B-Instruct