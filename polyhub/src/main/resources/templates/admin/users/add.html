<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/admin/layouts/main_layout :: layout(~{this :: myContent})}">
<head>
    <meta charset="UTF-8">
    <title>Thêm người dùng mới</title>
</head>
<body>
<div th:fragment="myContent">
    <h2 class="fw-bold mb-3">Thêm người dùng mới</h2>

    <div class="poly-card card">
        <div class="card-body">
            <form th:action="@{/admin/users/add}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required>
                </div>
                <div class="mb-3">
                    <label for="fullname" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullname" th:field="*{fullname}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Vai trò</label>
                    <select class="form-select" id="role" th:field="*{role}" required>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-poly">Lưu</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
