<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layouts/admin_layout :: layout(~{this :: myCss}, ~{this :: myContent}, ~{this :: myJs}, 'dashboard')}">
<head>
    <title>Dashboard - PolyHUB Admin</title>
    <th:block th:fragment="myCss"></th:block>
</head>
<body>
    <div th:fragment="myContent">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div>
                        <h3 class="fw-bold mb-0 text-dark" style="letter-spacing: -0.5px;">Dashboard</h3>
                        <ol class="breadcrumb mb-1 text-uppercase text-muted mt-2" style="font-size: 11px; font-weight: 600;">
                            <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none text-muted">Trang chủ</a></li>
                            <li class="breadcrumb-item active">Dashboard</li>
                        </ol>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="avatar-sm rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center">
                                    <i class="bi bi-people-fill fs-4"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="text-muted mb-1">Tổng người dùng</p>
                                <h4 class="mb-0 fw-bold" th:text="${totalUsers}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="avatar-sm rounded-circle bg-success-subtle text-success d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-check-fill fs-4"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="text-muted mb-1">Mentor được duyệt</p>
                                <h4 class="mb-0 fw-bold" th:text="${approvedMentorRequests}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="avatar-sm rounded-circle bg-warning-subtle text-warning d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-plus-fill fs-4"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="text-muted mb-1">Yêu cầu chờ</p>
                                <h4 class="mb-0 fw-bold" th:text="${pendingMentorRequests}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="avatar-sm rounded-circle bg-danger-subtle text-danger d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-x-fill fs-4"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="text-muted mb-1">Yêu cầu từ chối</p>
                                <h4 class="mb-0 fw-bold" th:text="${rejectedMentorRequests}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 mt-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-3">Thống kê Mentor</h5>
                        <canvas id="mentorRequestsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 mt-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-3">Người dùng mới</h5>
                        <canvas id="newUsersChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-12 mt-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-bottom-0">
                        <h5 class="card-title fw-bold text-dark mb-0">Yêu cầu trở thành Mentor</h5>
                    </div>
                    <div class="card-body pt-0">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Họ và tên</th>
                                        <th>Email</th>
                                        <th>Chuyên ngành</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${pendingRequestsList}">
                                        <td th:text="${user.fullname}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td th:text="${user.mentorMajor}"></td>
                                        <td>
                                            <a th:href="@{/admin/mentors/detail}" class="btn btn-sm btn-primary">Xem chi tiết</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:fragment="myJs">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            /*<![CDATA[*/
            const mentorRequestsCtx = document.getElementById('mentorRequestsChart').getContext('2d');
            new Chart(mentorRequestsCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Chờ duyệt', 'Đã duyệt', 'Từ chối'],
                    datasets: [{
                        label: 'Số lượng',
                        data: [/*[[${pendingMentorRequests}]]*/, /*[[${approvedMentorRequests}]]*/, /*[[${rejectedMentorRequests}]]*/],
                        backgroundColor: [
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(255, 99, 132, 0.7)'
                        ],
                        borderColor: [
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(255, 99, 132, 1)'
                        ],
                        borderWidth: 1
                    }]
                }
            });

            // Fake data for new users chart
            const newUsersCtx = document.getElementById('newUsersChart').getContext('2d');
            new Chart(newUsersCtx, {
                type: 'line',
                data: {
                    labels: ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'],
                    datasets: [{
                        label: 'Người dùng mới',
                        data: [12, 19, 3, 5, 2, 3, 7],
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                 options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            /*]]>*/
        </script>
    </th:block>
</body>
</html>
