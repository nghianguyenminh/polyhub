<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/admin_layout :: layout(~{this::title}, ~{this::myContent})}"
>
<head>
  <title>Dashboard - PolyHUB</title>
</head>
<body>
  <div th:fragment="myContent">
    <!-- Page-Title -->
    <div class="row">
      <div class="col-sm-12">
        <div class="page-title-box">
          <div class="row">
            <div class="col">
              <h4 class="page-title">Dashboard</h4>
              <ol class="breadcrumb">
                <li class="breadcrumb-item active">Dashboard</li>
              </ol>
            </div>
            <!--end col-->
            <div class="col-auto align-self-center">
              <a
                href="#"
                class="btn btn-sm btn-outline-primary"
                id="Dash_Date"
                ><span class="day-name" id="Day_Name">Today:</span>&
bsp;
                <span class="" id="Select_date">Jan 11</span>
                <i
                  data-feather="calendar"
                  class="align-self-center icon-xs ms-1"
                ></i>
              </a>
            </div>
            <!--end col-->
          </div>
          <!--end row-->
        </div>
        <!--end page-title-box-->
      </div>
      <!--end col-->
    </div>
    <div class="row">
      <div class="col-lg-12">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-3">
            <div class="card report-card">
              <div class="card-body">
                <div class="row d-flex justify-content-center">
                  <div class="col-5">
                    <i
                      class="fas fa-user-plus text-primary font-30px"
                    ></i>
                  </div>
                  <div class="col-7 align-self-center">
                    <div class="report-main">
                      <h3 class="report-title" th:text="${pendingMentorRequests}">0</h3>
                      <span class="report-subtitle">Yêu cầu chờ</span>
                    </div>
                  </div>
                </div>
              </div>
              <!--end card-body-->
            </div>
            <!--end card-->
          </div>
          <!--end col-->
          <div class="col-md-6 col-lg-3">
            <div class="card report-card">
              <div class="card-body">
                <div class="row d-flex justify-content-center">
                  <div class="col-5">
                    <i
                      class="fas fa-user-check text-success font-30px"
                    ></i>
                  </div>
                  <div class="col-7 align-self-center">
                    <div class="report-main">
                      <h3 class="report-title" th:text="${approvedMentorRequests}">0</h3>
                      <span class="report-subtitle">Mentor đã duyệt</span>
                    </div>
                  </div>
                </div>
              </div>
              <!--end card-body-->
            </div>
            <!--end card-->
          </div>
          <!--end col-->
          <div class="col-md-6 col-lg-3">
            <div class="card report-card">
              <div class="card-body">
                <div class="row d-flex justify-content-center">
                  <div class="col-5">
                    <i class="fas fa-user-times text-danger font-30px"></i>
                  </div>
                  <div class="col-7 align-self-center">
                    <div class="report-main">
                      <h3 class="report-title" th:text="${rejectedMentorRequests}">0</h3>
                      <span class="report-subtitle">Yêu cầu từ chối</span>
                    </div>
                  </div>
                </div>
              </div>
              <!--end card-body-->
            </div>
            <!--end card-->
          </div>
          <!--end col-->
          <div class="col-md-6 col-lg-3">
            <div class="card report-card">
              <div class="card-body">
                <div class="row d-flex justify-content-center">
                  <div class="col-5">
                    <i class="fas fa-users text-info font-30px"></i>
                  </div>
                  <div class="col-7 align-self-center">
                    <div class="report-main">
                      <h3 class="report-title" th:text="${totalUsers}">0</h3>
                      <span class="report-subtitle">Tổng người dùng</span>
                    </div>
                  </div>
                </div>
              </div>
              <!--end card-body-->
            </div>
            <!--end card-->
          </div>
          <!--end col-->
        </div>
        <!--end row-->
        <div class="card">
          <div class="card-header">
            <div class="row align-items-center">
              <div class="col">
                <h4 class="card-title">Yêu cầu trở thành Mentor</h4>
              </div>
              <!--end col-->
              <div class="col-auto">
                <a th:href="@{/admin/mentors}" class="btn btn-sm btn-outline-primary">Xem tất cả</a>
              </div>
              <!--end col-->
            </div>
            <!--end row-->
          </div>
          <!--end card-header-->
          <div class="card-body">
            <div class="table-responsive">
              <table class="table mb-0">
                <thead class="thead-light">
                  <tr>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Chuyên ngành</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="user : ${pendingRequestsList}">
                    <td th:text="${user.fullname}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.mentorMajor}"></td>
                    <td>
                      <a th:href="@{/admin/mentors/detail}" class="btn btn-sm btn-primary">Xem chi tiết</a>
                    </td>
                  </tr>
                </tbody>
              </table>
              <!--end /table-->
            </div>
            <!--end /tableresponsive-->
          </div>
          <!--end card-body-->
        </div>
        <!--end card-->
      </div>
    </div>
  </div>
</body>
</html>
