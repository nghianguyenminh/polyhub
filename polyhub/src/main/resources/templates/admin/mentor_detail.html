<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layouts/admin_layout :: layout(~{this :: myCss}, ~{this :: myContent}, ~{this :: myJs}, 'mentors')}">
<head>
    <title>Chi tiết Hồ sơ Mentor - PolyHUB Admin</title>
    
    <th:block th:fragment="myCss">
        <style>
            .profile-cover {
                height: 140px;
                border-radius: var(--border-radius-lg);
                background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
                position: relative;
                margin-bottom: 60px;
                box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            }
            .profile-avatar-wrap {
                position: absolute;
                bottom: -50px;
                left: 30px;
                display: flex;
                align-items: flex-end;
                gap: 20px;
            }
            .profile-avatar {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                border: 4px solid #fff;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                object-fit: cover;
                background-color: #fff;
            }
            .profile-name {
                font-size: 1.5rem;
                font-weight: 700;
                color: #fff;
                margin-bottom: 2px;
                text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            }
            .profile-role-badge {
                padding: 4px 12px;
                font-size: 0.75rem;
                font-weight: 600;
                border-radius: 100px;
                background-color: rgba(255, 255, 255, 0.2);
                color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.3);
                margin-bottom: 20px;
            }
            .info-card {
                background: #fff;
                border-radius: var(--border-radius-lg);
                border: 1px solid var(--admin-border);
                box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
                padding: 1.5rem;
                height: auto;
                margin-bottom: 1.5rem;
            }
            .info-label-sm {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--admin-text-muted);
                font-weight: 600;
                margin-bottom: 4px;
            }
            .info-value-sm {
                font-size: 14px;
                color: var(--admin-text-main);
                font-weight: 500;
                margin-bottom: 1rem;
            }
            .card-title-custom {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--admin-text-main);
                margin-bottom: 1.25rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .status-badge-lg {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 10px 18px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .status-pending { background-color: #FEF3C7; color: #92400E; }
            .status-approved { background-color: #D1FAE5; color: #065F46; }
            .status-rejected { background-color: #FDE8E8; color: #9B1C1C; }
        </style>
    </th:block>
</head>
<body>

    <div th:fragment="myContent">
        <!-- 1. Header & Breadcrumb -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-0 text-dark">Chi tiết Hồ sơ Mentor</h3>
            </div>
            <!-- Action Buttons: Only show if the user is pending approval -->
             <div class="d-flex gap-2" th:if="${user.wantsToBecomeMentor}">
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#rejectionModal">
                    <i class="bi bi-x-circle me-2"></i>Từ chối
                </button>
                <form th:action="@{/admin/users/approve-mentor/{id}(id=${user.username})}" method="post">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle me-2"></i>Phê duyệt
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. Profile Cover -->
        <div class="profile-cover">
            <img th:src="@{/images/{img}(img=${user.coverImage})}" alt="Cover image" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius-lg);">
            <div class="profile-avatar-wrap">
                <img th:src="@{/images/user-avatars/{img}(img=${user.avatar})}" class="profile-avatar" alt="Avatar">
                <div>
                    <h4 class="profile-name" th:text="${user.fullname}"></h4>
                    <div class="profile-role-badge" th:text="'Username: ' + ${user.username}"></div>
                </div>
            </div>
        </div>

        <!-- 3. Content Layout -->
        <div class="row g-4">
            
            <!-- Left Column -->
            <div class="col-12 col-xl-4">
                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-clipboard-check"></i> Trạng thái Hồ sơ</h5>
                    
                    <!-- Pending Status -->
                    <div th:if="${user.wantsToBecomeMentor}" class="status-badge-lg status-pending">
                        <i class="bi bi-clock-history"></i> Chờ phê duyệt
                    </div>
                    
                    <!-- Approved Status -->
                    <div th:if="${user.role.id == 'MENTOR'}" class="status-badge-lg status-approved">
                        <i class="bi bi-check-circle-fill"></i> Đã phê duyệt
                    </div>
                    
                    <!-- Rejected Status -->
                    <div th:if="${!user.wantsToBecomeMentor && user.role.id != 'MENTOR'}" class="status-badge-lg status-rejected">
                        <i class="bi bi-x-circle-fill"></i> Đã từ chối
                    </div>
                </div>

                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-person-badge"></i> Thông tin cơ bản</h5>
                    
                    <div class="info-label-sm">Họ và tên</div>
                    <div class="info-value-sm" th:text="${user.fullname}"></div>
                    
                    <div class="info-label-sm">Username</div>
                    <div class="info-value-sm" th:text="${user.username}"></div>
                    
                    <div class="info-label-sm">Email</div>
                    <div class="info-value-sm" th:text="${user.email}"></div>

                    <div class="info-label-sm">Chuyên ngành đăng ký</div>
                    <div class="info-value-sm fw-bold text-primary" th:text="${user.mentorMajor}"></div>

                    <div class="info-label-sm">GPA Hiện tại</div>
                    <div class="info-value-sm" th:text="${user.gpa} + ' / 10'"></div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-12 col-xl-8">
                <!-- Rejection Banner: Only show if there is a rejection reason -->
                <div class="info-card" th:if="${user.rejectionReason != null and !user.rejectionReason.isEmpty()}">
                    <h5 class="card-title-custom text-danger"><i class="bi bi-exclamation-triangle"></i> Lý do từ chối</h5>
                    <p th:text="${user.rejectionReason}"></p>
                </div>

                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-chat-quote"></i> Lý do muốn trở thành Mentor</h5>
                    <p th:text="${user.mentorReason}"></p>
                </div>

                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-tools"></i> Bộ Kỹ năng (Tags)</h5>
                    <div>
                        <span class="skill-tag" th:each="skill : ${user.mentorSkills}" th:text="${skill}"></span>
                    </div>
                </div>

                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-paperclip"></i> Minh chứng (Evidence)</h5>
                    <a th:href="${user.evidenceLink}" class="evidence-link" target="_blank">
                        <i class="bi bi-box-arrow-up-right me-2"></i>
                        <span th:text="${user.evidenceName != null ? user.evidenceName : 'Link minh chứng'}"></span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Rejection Modal -->
        <div class="modal fade" id="rejectionModal" tabindex="-1" th:if="${user.wantsToBecomeMentor}">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Lý do từ chối</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/admin/users/reject-mentor/{id}(id=${user.username})}" method="post">
                            <textarea class="form-control" name="reason" rows="5" placeholder="Nhập lý do từ chối..." required></textarea>
                            <div class="modal-footer mt-3">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-danger">Xác nhận từ chối</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <th:block th:fragment="myJs"></th:block>
</body>
</html>
