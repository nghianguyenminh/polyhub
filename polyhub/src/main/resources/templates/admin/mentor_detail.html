<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layouts/admin_layout :: layout(~{this :: myCss}, ~{this :: myContent}, ~{this :: myJs}, 'mentors')}">
<head>
    <title th:text="'Hồ sơ: ' + ${mentorRequest.fullname} + ' - PolyHUB Admin'">Chi tiết Hồ sơ Mentor - PolyHUB Admin</title>
    
    <th:block th:fragment="myCss">
        <style>
            /* Your existing styles here... */
        </style>
    </th:block>
</head>
<body>

    <div th:fragment="myContent">
        <!-- 1. Header & Breadcrumb -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <!-- Breadcrumb... -->
        </div>

        <!-- 2. Profile Cover -->
        <div class="profile-cover">
            <div class="profile-avatar-wrap">
                <img th:src="${mentorRequest.user.getAvatarUrl()}" class="profile-avatar" alt="Avatar">
                <div style="margin-bottom: -15px;">
                    <div class="profile-name" th:text="${mentorRequest.fullname}"></div>
                    <div class="profile-role-badge" th:text="'Mã Sinh Viên: ' + ${mentorRequest.user.username}"></div>
                </div>
            </div>
        </div>

        <!-- 3. Layout Nội dung (Left / Right) -->
        <div class="row g-4">
            
            <!-- Cột Trái -->
            <div class="col-12 col-xl-4">
                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-person-badge"></i> Thông tin cơ bản</h5>
                    
                    <div class="info-label-sm">Họ và tên</div>
                    <div class="info-value-sm" th:text="${mentorRequest.fullname}"></div>
                    
                    <div class="info-label-sm">Mã Sinh Viên</div>
                    <div class="info-value-sm" th:text="${mentorRequest.user.username}"></div>
                    
                    <div class="info-label-sm">Email</div>
                    <div class="info-value-sm" th:text="${mentorRequest.email}"></div>

                    <div class="info-label-sm">Chuyên ngành đăng ký</div>
                    <div class="info-value-sm fw-bold text-primary">Lập trình Web</div>

                    <div class="info-label-sm">GPA Hiện tại</div>
                    <div class="info-value-sm">8.2 / 10</div>
                </div>

                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-journal-text"></i> Tiến trình xét duyệt</h5>
                    <!-- Timeline here -->
                </div>
            </div>

            <!-- Cột Phải -->
            <div class="col-12 col-xl-8">
                
                <!-- Cảnh báo Bị từ chối -->
                <div class="rejection-banner" th:if="${mentorRequest.status.name() == 'REJECTED'}">
                    <i class="bi bi-x-circle-fill"></i>
                    <div>
                        <h6 class="fw-bold text-danger mb-1">Hồ sơ này đã bị Từ chối</h6>
                        <p class="mb-0" style="font-size: 14px; color: #9B1C1C;">
                            <strong>Lý do từ chối:</strong>
                            <span th:text="${mentorRequest.rejectionReason}"></span>
                        </p>
                    </div>
                </div>

                <!-- Lời giới thiệu -->
                <div class="info-card">
                    <h5 class="card-title-custom"><i class="bi bi-chat-quote"></i> Lý do muốn trở thành Mentor</h5>
                    <div class="reason-box" th:text="${mentorRequest.motivation}"></div>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="info-card h-100">
                            <h5 class="card-title-custom"><i class="bi bi-tools"></i> Bộ Kỹ năng (Tags)</h5>
                            <div>
                                <!-- Skills here -->
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-card h-100">
                            <h5 class="card-title-custom"><i class="bi bi-paperclip"></i> Minh chứng (Evidence)</h5>
                            <div class="d-flex flex-column gap-2">
                                <a th:href="${mentorRequest.cvFile}" class="evidence-link" target="_blank">
                                    <i class="bi bi-file-earmark-pdf-fill evidence-icon"></i>
                                    <div class="flex-grow-1">
                                        <div class="fw-semibold text-dark">CV Ứng viên</div>
                                        <div class="text-muted" style="font-size: 12px;">Xem chi tiết</div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <th:block th:fragment="myJs"></th:block>
</body>
</html>
