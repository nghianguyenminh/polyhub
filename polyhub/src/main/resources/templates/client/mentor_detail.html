<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/main_layout :: layout(~{this :: myCss}, ~{this :: myContent}, 'mentors')}">
<head>
    <title>Chi tiết Mentor - PolyHUB</title>
    
    <th:block th:fragment="myCss">
        <link rel="stylesheet" th:href="@{/client/css/mentor_detail.css}">
    </th:block>
</head>
<body>

    <div th:fragment="myContent" class="poly-main-feed" style="max-width: 900px;">
        
        <!-- Header / Cover Section -->
        <div class="poly-card overflow-hidden mb-4 border-0 shadow-sm rounded-4 position-relative profile-header-card">
            <div class="mentor-cover" style="background-image: url('https://images.unsplash.com/photo-1550439062-609e1531270e?q=80&w=1000'); height: 220px; background-size: cover; background-position: center;">
            </div>
            
            <div class="px-4 pb-4 position-relative bg-white pt-2">
                <div class="d-flex flex-column flex-md-row align-items-center align-items-md-end" style="margin-top: -70px;">
                    <img th:src="${mentor.user.avatar != null ? mentor.user.avatar : 'https://ui-avatars.com/api/?name=' + mentor.fullname + '&background=random'}" class="rounded-circle border border-4 border-white shadow bg-white flex-shrink-0" width="140" height="140" style="object-fit: cover; z-index: 10;">
                    
                    <div class="ms-md-4 mt-3 mt-md-0 flex-grow-1 text-center text-md-start z-index-1" style="margin-bottom: 10px;">
                        <h3 class="fw-bold mb-1 text-dark d-flex align-items-center justify-content-center justify-content-md-start text-break">
                            <span th:text="${mentor.fullname}">Tên Mentor</span> <i class="bi bi-patch-check-fill text-primary ms-2 fs-5" title="Chuyên gia được xác thực" style="background: -webkit-linear-gradient(45deg, #f27121, #e94057); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                        </h3>
                        <p class="text-muted mb-2 fw-medium text-break"><i class="bi bi-briefcase-fill me-1 text-secondary"></i> <span th:text="${mentor.introduction}">Giới thiệu chức danh</span></p>
                    </div>

                    <div class="ms-md-auto mt-4 mt-md-0 d-flex gap-2 w-100 flex-column flex-md-row" style="max-width: 320px;">
                        <!-- Chỉnh sửa màu sắc của nút về tone màu chuẩn của dự án PolyHUB -->
                        <a th:href="@{/chat(userId=${mentor.user.username})}" class="btn btn-light fw-bold rounded-pill px-4 py-2 flex-grow-1 shadow-sm d-flex align-items-center justify-content-center text-dark border text-decoration-none">
                            <i class="bi bi-chat-dots-fill me-2 text-poly"></i> Nhắn tin
                        </a>
                       
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column -->
            <div class="col-lg-8">
                <div class="poly-card p-4 mb-4 rounded-4 shadow-sm border-0">
                    <h5 class="fw-bold mb-3 pb-2 border-bottom"><i class="bi bi-person-lines-fill text-poly me-2"></i> Lý do / Giới thiệu</h5>
                    <p class="text-secondary" style="line-height: 1.7; white-space: pre-line;" th:text="${mentor.motivation}"></p>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-4">
                <div class="poly-card p-4 rounded-4 shadow-sm border-0 mb-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-info-circle-fill text-info me-2"></i> Thông tin & Hồ sơ</h6>
                    
                    <ul class="list-unstyled mb-0">
                        <li class="mb-3 d-flex align-items-start">
                            <i class="bi bi-envelope-fill text-secondary me-3 mt-1 fs-5"></i> 
                            <div class="overflow-hidden w-100">
                                <div class="text-muted" style="font-size: 12px;">Email</div>
                                <div class="fw-medium text-dark text-break text-wrap" th:text="${mentor.email}">example@gmail.com</div>
                            </div>
                        </li>
                        <li class="mb-3 d-flex align-items-start">
                            <i class="bi bi-telephone-fill text-secondary me-3 mt-1 fs-5"></i> 
                            <div class="overflow-hidden w-100">
                                <div class="text-muted" style="font-size: 12px;">Điện thoại</div>
                                <div class="fw-medium text-dark text-break" th:text="${mentor.phone}">012XXX</div>
                            </div>
                        </li>
                        <li th:if="${mentor.cvFile != null}" class="mb-2 d-flex align-items-start">
                            <i class="bi bi-file-earmark-pdf-fill text-danger me-3 mt-1 fs-5"></i> 
                            <div class="overflow-hidden w-100">
                                <div class="text-muted" style="font-size: 12px;">Hồ sơ CV</div>
                                <a th:href="${mentor.cvFile}" target="_blank" class="fw-medium text-poly text-decoration-none">Xem CV đính kèm</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
