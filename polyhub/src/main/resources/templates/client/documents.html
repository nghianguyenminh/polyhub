<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/main_layout :: layout(~{this :: myCss}, ~{this :: myContent}, 'documents')}">
<head>
    <title>Góc Tài liệu - PolyHUB</title>
    
    <th:block th:fragment="myCss">
        <link rel="stylesheet" th:href="@{/client/css/documents.css}">
    </th:block>
</head>
<body>

 <div th:fragment="myContent" class="poly-main-feed" style="max-width: 1000px; width: 100%;">
        
        <div class="poly-card p-3 mb-4" style="background: linear-gradient(to right, #ffffff, #fffaf5);">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h5 class="fw-bold mb-1 text-dark">Thư viện Tài liệu</h5>
                    <div class="text-muted" style="font-size: 13px;">Hơn 5,000+ tài liệu, đề thi, slide bài giảng được chia sẻ</div>
                </div>
                <button class="btn btn-poly-gradient fw-bold rounded-pill px-3 py-2 shadow-sm d-flex align-items-center" style="font-size: 13.5px;" data-bs-toggle="modal" data-bs-target="#uploadDocModal">
                    <i class="bi bi-cloud-arrow-up-fill me-2 fs-5"></i> Chia sẻ tài liệu
                </button>
            </div>
            
            <div class="input-group mt-3 shadow-sm" style="border-radius: 50rem; border: 1px solid rgba(242, 113, 37, 0.2); background: white;">
                <span class="input-group-text bg-transparent border-0 text-poly ps-3 pe-2 py-2">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" style="font-size: 13.5px;" placeholder="Tìm kiếm theo mã môn (vd: SOF3021), tên tài liệu, chuyên ngành...">
                <button class="btn btn-poly-gradient px-4 fw-bold py-2" style="border-radius: 0 50rem 50rem 0; font-size: 13.5px;">Tìm kiếm</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 mb-4 overflow-visible">
            <button class="filter-coursera shadow-sm fw-bold text-dark">
                <i class="bi bi-sliders"></i> Bộ lọc
            </button>
            <div class="vr mx-1 opacity-25"></div> 
            
            <div class="dropdown">
                <button class="filter-coursera dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    Chuyên ngành <i class="bi bi-chevron-down ms-1" style="font-size: 11px;"></i>
                </button>
                <div class="dropdown-menu coursera-dropdown-menu shadow">
                    <div class="coursera-filter-header">Chọn Chuyên ngành</div>
                    <div class="coursera-filter-body">
                        <div class="form-check custom-checkbox mb-2" th:each="category : ${categories}">
                            <input class="form-check-input shadow-none" type="checkbox" th:id="'d_cn_' + ${category.id}" th:value="${category.id}">
                            <label class="form-check-label d-flex justify-content-between w-100" th:for="'d_cn_' + ${category.id}">
                                <span class="text-truncate" style="max-width: 85%;" th:text="${category.name}">Phát triển Phần mềm</span>
                                <span class="text-muted" th:text="${category.documents != null ? category.documents.size() : 0}">(0)</span>
                            </label>
                        </div>
                    </div>
                    <div class="coursera-filter-footer">
                        <button class="btn btn-poly-gradient btn-sm rounded-pill px-4 fw-bold">Áp dụng</button>
                        <button class="btn btn-link btn-sm text-muted text-decoration-none fw-medium" style="color: #6c757d !important;">Xóa lọc</button>
                    </div>
                </div>
            </div>

            <div class="dropdown">
                <button class="filter-coursera dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    Loại tài liệu <i class="bi bi-chevron-down ms-1" style="font-size: 11px;"></i>
                </button>
                <div class="dropdown-menu coursera-dropdown-menu shadow">
                    <div class="coursera-filter-header">Định dạng file</div>
                    <div class="coursera-filter-body">
                        <div class="form-check custom-checkbox mb-2">
                            <input class="form-check-input shadow-none" type="checkbox" id="type-pdf" value="PDF">
                            <label class="form-check-label d-flex justify-content-between w-100" for="type-pdf">
                                <span>PDF</span> <span class="text-muted">...</span>
                            </label>
                        </div>
                        <div class="form-check custom-checkbox mb-2">
                            <input class="form-check-input shadow-none" type="checkbox" id="type-word" value="WORD">
                            <label class="form-check-label d-flex justify-content-between w-100" for="type-word">
                                <span>Word (DOC/DOCX)</span> <span class="text-muted">...</span>
                            </label>
                        </div>
                        <div class="form-check custom-checkbox mb-2">
                            <input class="form-check-input shadow-none" type="checkbox" id="type-excel" value="EXCEL">
                            <label class="form-check-label d-flex justify-content-between w-100" for="type-excel">
                                <span>Excel (XLS/XLSX)</span> <span class="text-muted">...</span>
                            </label>
                        </div>
                        <div class="form-check custom-checkbox mb-2">
                            <input class="form-check-input shadow-none" type="checkbox" id="type-other" value="OTHER">
                            <label class="form-check-label d-flex justify-content-between w-100" for="type-other">
                                <span>Khác</span> <span class="text-muted">...</span>
                            </label>
                        </div>
                    </div>
                    <div class="coursera-filter-footer">
                        <button class="btn btn-poly-gradient btn-sm rounded-pill px-4 fw-bold">Áp dụng</button>
                        <button class="btn btn-link btn-sm text-muted text-decoration-none fw-medium" style="color: #6c757d !important;">Xóa lọc</button>
                    </div>
                </div>
            </div>
        </div>

        <ul class="nav nav-underline mb-3 border-bottom" role="tablist" style="gap: 20px;">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold pb-2" style="color: var(--poly-primary);">Mới nhất</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-muted fw-medium pb-2">Đã lưu (12)</button>
            </li>
        </ul>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 mb-4">
            
            <div class="col" th:each="doc : ${documents}">
                <div class="doc-card h-100 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="doc-icon-box" 
                             th:classappend="${doc.documentType == 'PDF' ? 'bg-danger-soft text-danger' : 
                                            (doc.documentType == 'WORD' ? 'bg-primary-soft text-primary' : 
                                            (doc.documentType == 'ZIP' ? 'bg-warning-soft text-warning' : 'bg-info-soft text-info'))}">
                            <i class="bi" th:classappend="${doc.documentType == 'PDF' ? 'bi-file-earmark-pdf-fill' : 
                                                         (doc.documentType == 'WORD' ? 'bi-file-earmark-word-fill' : 
                                                         (doc.documentType == 'ZIP' ? 'bi-file-earmark-zip-fill' : 'bi-file-earmark-fill'))}"></i>
                        </div>
                        <button class="btn-icon-transparent text-muted"><i class="bi bi-bookmark"></i></button>
                    </div>
                    
                    <div class="mb-2 flex-grow-1">
                        <span class="badge bg-light text-dark border mb-2 fw-normal" th:text="${doc.category.name}">SOF3021</span>
                        <h6 class="doc-title text-dark" th:text="${doc.title}">Tiêu đề tài liệu</h6>
                    </div>
                    
                    <div class="doc-meta text-muted mb-3 d-flex align-items-center">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" class="rounded-circle me-2" width="16" height="16">
                        <span class="text-truncate">Sinh viên</span>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                        <div class="text-muted" style="font-size: 11.5px;"><i class="bi bi-download me-1"></i> <span th:text="${doc.downloadCount}">0</span></div>
                        <a th:href="${doc.fileUrl}" target="_blank" class="btn btn-download btn-sm rounded-pill fw-bold">Tải về</a>
                    </div>
                </div>
            </div>

        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination poly-pagination justify-content-center mt-4 mb-5">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1" aria-disabled="true"><i class="bi bi-chevron-left"></i></a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><span class="page-link border-0 text-muted">...</span></li>
                <li class="page-item"><a class="page-link" href="#">12</a></li>
                <li class="page-item">
                    <a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a>
                </li>
            </ul>
        </nav>

        <!-- MODAL UPLOAD TÀI LIỆU -->
        <div class="modal fade" id="uploadDocModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header pb-2 border-0">
                        <h5 class="modal-title fw-bold text-dark"><i class="bi bi-cloud-arrow-up-fill text-poly me-2"></i>Chia sẻ Tài liệu mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <form th:action="@{/documents/upload}" method="post" enctype="multipart/form-data">
                        <div class="modal-body pt-2">
                            <div class="row g-3">
                                
                                <div class="col-md-12">
                                    <label class="form-label fw-medium text-muted mb-1" style="font-size: 13.5px;">Tên tài liệu / Tiêu đề <span class="text-danger">*</span></label>
                                    <input type="text" name="title" class="form-control bg-light" placeholder="Ví dụ: Đề thi thử SOF3021, Slide Thuyết trình Agile..." required>
                                </div>
                                
                                <div class="col-md-12">
                                    <label class="form-label fw-medium text-muted mb-1" style="font-size: 13.5px;">Mô tả ngắn</label>
                                    <textarea name="description" class="form-control bg-light" rows="3" placeholder="Ghi chú thêm về nội dung tài liệu để mọi người dễ dàng tìm kiếm..."></textarea>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-muted mb-1" style="font-size: 13.5px;">Chuyên ngành / Nhóm ngành <span class="text-danger">*</span></label>
                                    <select name="categoryId" class="form-select bg-light" required>
                                        <option value="" disabled selected>-- Chọn chuyên ngành --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-muted mb-1" style="font-size: 13.5px;">Tệp đính kèm <span class="text-danger">*</span></label>
                                    <input type="file" name="file" class="form-control bg-light" required accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z">
                                    <small class="text-muted" style="font-size: 11px;">Hỗ trợ: PDF, Word, Excel, PPT, ZIP, RAR.</small>
                                </div>
                                
                            </div>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                            <button type="button" class="btn btn-light fw-medium rounded-pill px-4" data-bs-dismiss="modal">Hủy bỏ</button>
                            <button type="submit" class="btn btn-poly-gradient fw-bold rounded-pill px-4">Đăng tải lên</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
