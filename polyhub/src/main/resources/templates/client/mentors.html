<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/main_layout :: layout(~{this :: myCss}, ~{this :: myContent}, 'mentors')}">
<head>
    <title>Poly Mentors - Kết nối Chuyên gia</title>
    
    <th:block th:fragment="myCss">
        <link rel="stylesheet" th:href="@{/client/css/mentors.css}">
    </th:block>
</head>
<body>

    <div th:fragment="myContent" class="poly-main-feed" style="max-width: 850px;">
        
        <div class="poly-card p-3 mb-4" style="background: linear-gradient(to right, #ffffff, #fffaf5);">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h5 class="fw-bold mb-1 text-dark">Kết nối Mentor</h5>
                    <div class="text-muted" style="font-size: 13px;">Tìm kiếm chuyên gia để định hướng và hỗ trợ dự án của bạn</div>
                </div>
                <a th:href="@{/mentors/register}" class="btn btn-poly-gradient fw-bold rounded-pill px-3 py-2 shadow-sm d-flex align-items-center text-decoration-none text-white" style="font-size: 13.5px;">
                    Trở thành Mentor
                </a>
            </div>
            
            <div class="input-group mt-3 shadow-sm" style="border-radius: 50rem; border: 1px solid rgba(242, 113, 37, 0.2); background: white;">
                <span class="input-group-text bg-transparent border-0 text-poly ps-3 pe-2 py-2">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" style="font-size: 13.5px;" placeholder="Tìm kiếm theo tên, ngôn ngữ lập trình, chuyên ngành...">
                <button class="btn btn-poly-gradient px-4 fw-bold py-2" style="border-radius: 0 50rem 50rem 0; font-size: 13.5px;">Tìm kiếm</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 mb-4 overflow-visible">
            <button class="filter-coursera shadow-sm fw-bold text-dark">
                <i class="bi bi-sliders"></i> Sắp xếp
            </button>
            <div class="vr mx-1 opacity-25"></div> 
            
            <form action="/mentors" method="get" id="filterForm" class="m-0">
                <select name="sort" class="form-select form-select-sm shadow-sm cursor-pointer" style="border-radius: 50rem; padding-left: 1rem; padding-right: 2rem; font-size: 13.5px; font-weight: 500;" onchange="document.getElementById('filterForm').submit();">
                    <option value="newest" th:selected="${currentSort == 'newest'}">Mới tham gia (Mới nhất)</option>
                    <option value="oldest" th:selected="${currentSort == 'oldest'}">Gạo cội (Cũ nhất)</option>
                </select>
            </form>
        </div>

        <!-- <div class="d-flex justify-content-between align-items-end mb-3 px-1">
            <h6 class="fw-bold text-dark mb-0 fs-5">Mentor nổi bật tuần này <i class="bi bi-fire text-danger ms-1"></i></h6>
            <a href="#" class="text-poly text-decoration-none fw-medium" style="font-size: 13.5px;">Xem tất cả</a>
        </div> -->
   
        <div class="row row-cols-1 row-cols-md-2 g-3 mb-5">
            
            <div class="col" th:each="req : ${approvedMentors}">
                <div class="mentor-profile-card">
                    <div class="mentor-card-cover" style="background-image: url('https://images.unsplash.com/photo-1550439062-609e1531270e?q=80&w=600');"></div>
                    
                    <div class="mentor-card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <img th:src="${req.user.avatar != null ? req.user.avatar : 'https://ui-avatars.com/api/?name=' + req.fullname + '&background=random'}" class="mentor-card-avatar">
                            <div class="mentor-rating mt-2 shadow-sm">
                                <i class="bi bi-star-fill text-warning"></i> 5.0 <span class="text-muted fw-normal">(0)</span>
                            </div>
                        </div>
                        
                        <div class="mt-2 mb-3">
                            <h5 class="fw-bold text-dark mb-0 d-flex align-items-center">
                                <span th:text="${req.fullname}">N/A</span>
                                <i class="bi bi-patch-check-fill text-primary ms-1 fs-6" title="Đã xác thực" style="background: -webkit-linear-gradient(45deg, #f27121, #e94057); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                            </h5>
                            <div class="text-muted" style="font-size: 13px; font-weight: 500;" th:text="${req.introduction}">Introduction</div>
                        </div>
                        
                        <p class="mentor-bio" th:text="${req.motivation}">"Motivation string here..."</p>
                        
                        <div class="d-flex flex-wrap gap-1 mb-3">
                            <span class="mentor-tag">Mentor</span>
                            <span class="mentor-tag">Polyhub</span>
                        </div>
                        
                        <div class="d-flex justify-content-between text-muted mb-3" style="font-size: 12.5px; font-weight: 500;">
                            <div><i class="bi bi-people-fill me-1"></i> 0 Mentee</div>
                            <div><i class="bi bi-journal-check me-1"></i> 0 Dự án</div>
                        </div>
                        
                        <div class="d-flex gap-2 mt-auto">
                            <a th:href="@{'/profile?username=' + ${req.user.username}}" class="btn btn-light flex-grow-1 rounded-pill fw-bold text-dark border shadow-sm btn-action">Hồ sơ</a>
                            <button class="btn btn-poly-gradient flex-grow-1 rounded-pill fw-bold btn-action"><i class="bi bi-chat-dots-fill me-1"></i> Nhắn tin</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <nav th:if="${totalPages > 1}" aria-label="Page navigation">
            <ul class="pagination poly-pagination justify-content-center mt-4 mb-5">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/mentors(page=${currentPage - 1}, sort=${currentSort})}" tabindex="-1" aria-disabled="true"><i class="bi bi-chevron-left"></i></a>
                </li>
                
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/mentors(page=${i}, sort=${currentSort})}" th:text="${i}">1</a>
                </li>
                
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/mentors(page=${currentPage + 1}, sort=${currentSort})}"><i class="bi bi-chevron-right"></i></a>
                </li>
            </ul>
        </nav>

    </div>

</body>
</html>
