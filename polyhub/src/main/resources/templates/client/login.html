<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - PolyHUB</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/client/css/auth.css}">
</head>
<body>

    <canvas id="techCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="text-center mb-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 bg-poly-soft rounded-circle" style="width: 48px; height: 48px;">
                    <i class="bi bi-hexagon-fill text-poly fs-4"></i>
                </div>
                <h1 class="auth-title text-dark">Chào mừng trở lại!</h1>
                <p class="auth-subtitle">Vui lòng đăng nhập vào tài khoản của bạn</p>
            </div>

            <div th:if="${param.error}" class="alert-custom alert-error">
                <i class="bi bi-exclamation-circle-fill"></i> Email hoặc mật khẩu không chính xác!
            </div>
            <div th:if="${param.logout}" class="alert-custom alert-success">
                <i class="bi bi-check-circle-fill"></i> Bạn đã đăng xuất thành công.
            </div>
            <div th:if="${param.registerSuccess}" class="alert-custom alert-success">
                <i class="bi bi-check-circle-fill"></i> Đăng ký thành công! Vui lòng đăng nhập.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Email hoặc Mã sinh viên</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" class="form-control-custom" id="username" name="username" placeholder="Nhập email hoặc mã sinh viên" required autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">Mật khẩu</label>
                        <a href="/forgot-password" class="text-poly text-decoration-none fw-medium" style="font-size: 13px;">Quên mật khẩu?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control-custom pe-5" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-pass" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check custom-check mb-4">
                    <input type="checkbox" class="form-check-input shadow-none" id="remember-me" name="remember-me">
                    <label class="form-check-label" for="remember-me">Ghi nhớ đăng nhập</label>
                </div>

                <button type="submit" class="btn-submit">
                    Đăng nhập
                </button>
            </form>

            <div class="text-center mt-4 pt-2">
                <span style="font-size: 14px; color: #6B7280;">Chưa có tài khoản? </span>
                <a href="/register" class="text-poly text-decoration-none fw-semibold" style="font-size: 14px;">Đăng ký ngay</a>
            </div>

        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('bi-eye');
            this.querySelector('i').classList.toggle('bi-eye-slash');
        });
    </script>

    <script>
        const canvas = document.getElementById('techCanvas');
        const ctx = canvas.getContext('2d');
        
        let particlesArray = [];
        // Unicode của Bootstrap Icons: Cloud, Database, Code, CPU, Globe/Network, Robot/AI
        const techIcons = ['\uF28E', '\uF30C', '\uF288', '\uF2A2', '\uF3E1', '\uF6B0'];
        
        // Trạng thái chuột
        const mouse = {
            x: null,
            y: null,
            radius: 150 // Bán kính vùng tương tác đẩy (Repulsion)
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }
        window.addEventListener('resize', resize);

        // Lớp Hạt (Particle)
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 12; // Kích thước icon 12px - 24px
                this.icon = techIcons[Math.floor(Math.random() * techIcons.length)];
                
                // Vận tốc di chuyển lơ lửng chậm
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                // Cấu hình Opacity dao động
                this.baseOpacity = Math.random() * 0.3 + 0.1; // 0.1 - 0.4
                this.opacity = this.baseOpacity;
                this.opacityDirection = Math.random() > 0.5 ? 1 : -1;
                this.mass = this.size / 2; // Khối lượng ảnh hưởng lực đẩy
            }

            update() {
                // Hiệu ứng Repulsion (Né con trỏ chuột)
                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        // Tính toán lực đẩy ra xa
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = forceDirectionX * force * (this.mass * 0.1);
                        let directionY = forceDirectionY * force * (this.mass * 0.1);

                        this.x += directionX;
                        this.y += directionY;
                    }
                }

                // Di chuyển lơ lửng tự nhiên
                this.x += this.vx;
                this.y += this.vy;

                // Nảy lại khi chạm viền màn hình
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                // Hiệu ứng chớp nháy (Pulsing Opacity) mượt mà
                this.opacity += 0.002 * this.opacityDirection;
                if (this.opacity >= 0.6) this.opacityDirection = -1;
                if (this.opacity <= 0.1) this.opacityDirection = 1;
            }

            draw() {
                ctx.fillStyle = `rgba(242, 113, 37, ${this.opacity})`; // Màu cam PolyHUB
                ctx.font = `${this.size}px "bootstrap-icons"`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);
            }
        }

        // Khởi tạo hệ thống
        function init() {
            particlesArray = [];
            // Tính toán mật độ tương đối theo diện tích màn hình
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 25000);
            
            // Fallback Mobile & Max Density Limit
            if (numberOfParticles > 60) numberOfParticles = 60;
            if (window.innerWidth <= 768) numberOfParticles = 25; 

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // Vòng lặp Render (Tối ưu bằng requestAnimationFrame)
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                
                // Vẽ các đường kết nối mạng lưới (Network lines)
                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        // Đường line mờ dần theo khoảng cách
                        let lineOpacity = 0.15 - (distance / 120) * 0.15;
                        ctx.strokeStyle = `rgba(242, 113, 37, ${lineOpacity})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Đảm bảo font Bootstrap Icons đã tải xong trước khi render Canvas
        document.fonts.ready.then(() => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
            animate();
        });
    </script>
</body>
</html>
