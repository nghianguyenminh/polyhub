<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | PolyHUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .btn-poly {
            background: linear-gradient(90deg, #F09819 0%, #EDDE5D 100%);
            border: none;
            color: #fff;
            font-weight: 600;
        }
        .btn-poly:hover { background: linear-gradient(90deg, #EDDE5D 0%, #F09819 100%); color: #fff;}
        /* Khu vực hiển thị ảnh nền bên phải */
        .bg-login-image {
            /* Sếp nhớ lưu ảnh 2 bạn sinh viên vào thư mục static/client/images/fpt-students.jpg nhé */
            background: url('/client/images/fpt-students.jpg') center center;
            background-size: cover;
        }
        .form-control:focus { border-color: #F09819; box-shadow: 0 0 0 0.25rem rgba(240, 152, 25, 0.25); }
    </style>
</head>
<body>
    <div class="container-fluid vh-100">
        <div class="row h-100">
            <div class="col-md-5 d-flex align-items-center justify-content-center bg-white">
                <div class="w-75 p-4">
                    <div class="text-center mb-5">
                        <img src="/client/images/logo.png" alt="PolyHUB Logo" width="80" class="mb-3"> <h2 class="fw-bold">Đăng Nhập</h2>
                        <p class="text-muted">Nhập email và mật khẩu để đăng nhập</p>
                    </div>

                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control py-2" placeholder="nghianmtc00523@fpt.edu.vn">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group">
                                <input type="password" class="form-control py-2" placeholder="********">
                                <span class="input-group-text bg-white cursor-pointer"><i class="bi bi-eye-slash"></i></span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>
                            <a href="#" class="text-decoration-none text-danger fw-semibold">Quên mật khẩu?</a>
                        </div>
                        
                        <a th:href="@{/}" class="btn btn-poly w-100 py-2 mb-4 rounded-pill">Đăng nhập</a>

                        <div class="text-center text-muted mb-4">Hoặc đăng nhập với</div>
                        
                        <div class="d-flex justify-content-between gap-2">
                            <button type="button" class="btn btn-outline-secondary w-50 rounded-pill"><i class="bi bi-google text-danger"></i> Google</button>
                            <button type="button" class="btn btn-outline-secondary w-50 rounded-pill"><i class="bi bi-facebook text-primary"></i> Facebook</button>
                        </div>

                        <div class="text-center mt-5">
                            <span class="text-muted">Bạn chưa có tài khoản?</span> 
                            <a href="#" class="text-danger text-decoration-none fw-semibold">Đăng ký</a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="col-md-7 d-none d-md-block bg-login-image shadow-sm"></div>
        </div>
    </div>
</body>
</html>
