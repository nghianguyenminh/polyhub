<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - PolyHUB</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/client/css/auth.css}">
</head>
<body>

    <canvas id="techCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="text-center mb-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 bg-poly-soft rounded-circle" style="width: 48px; height: 48px;">
                    <i class="bi bi-shield-lock-fill text-poly fs-4"></i>
                </div>
                <h1 class="auth-title text-dark">Quên Mật Khẩu</h1>
                <p class="auth-subtitle">Nhập địa chỉ email của bạn, chúng tôi sẽ gửi mã xác thực (OTP) tới hộp thư.</p>
            </div>

            <!-- Hiển thị thông báo -->
            <div th:if="${error}" class="alert-custom alert-error mb-3">
                <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
            </div>
            <div th:if="${param.error}" class="alert-custom alert-error mb-3">
                <i class="bi bi-exclamation-circle-fill"></i> Bạn nhập sai email hoặc tài khoản không tồn tại.
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group mb-4">
                    <label class="form-label" for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" class="form-control-custom" id="email" name="email" placeholder="example@fpt.edu.vn" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn-submit mb-3">
                    Gửi OTP Xác Thực
                </button>
            </form>

            <div class="text-center mt-4 pt-2">
                <span style="font-size: 14px; color: #6B7280;">Nhớ lại mật khẩu? </span>
                <a href="/login" class="text-poly text-decoration-none fw-semibold" style="font-size: 14px;">Đăng nhập</a>
            </div>

        </div>
    </div>

    <!-- Script tạo hiệu ứng nền giống trang Login -->
    <script>
        const canvas = document.getElementById('techCanvas');
        const ctx = canvas.getContext('2d');
        
        let particlesArray = [];
        const techIcons = ['\uF28E', '\uF30C', '\uF288', '\uF2A2', '\uF3E1', '\uF6B0'];
        
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 12;
                this.icon = techIcons[Math.floor(Math.random() * techIcons.length)];
                
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                this.baseOpacity = Math.random() * 0.3 + 0.1;
                this.opacity = this.baseOpacity;
                this.opacityDirection = Math.random() > 0.5 ? 1 : -1;
                this.mass = this.size / 2;
            }

            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = forceDirectionX * force * (this.mass * 0.1);
                        let directionY = forceDirectionY * force * (this.mass * 0.1);

                        this.x += directionX;
                        this.y += directionY;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                this.opacity += 0.002 * this.opacityDirection;
                if (this.opacity >= 0.6) this.opacityDirection = -1;
                if (this.opacity <= 0.1) this.opacityDirection = 1;
            }

            draw() {
                ctx.fillStyle = `rgba(242, 113, 37, ${this.opacity})`;
                ctx.font = `${this.size}px "bootstrap-icons"`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 25000);
            if (numberOfParticles > 60) numberOfParticles = 60;
            if (window.innerWidth <= 768) numberOfParticles = 25; 

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                
                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        let lineOpacity = 0.15 - (distance / 120) * 0.15;
                        ctx.strokeStyle = `rgba(242, 113, 37, ${lineOpacity})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        document.fonts.ready.then(() => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
            animate();
        });
    </script>
</body>
</html>
