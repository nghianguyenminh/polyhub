<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP - PolyHUB</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/client/css/auth.css}">
</head>
<body>

    <canvas id="techCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="text-center mb-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 bg-poly-soft rounded-circle" style="width: 48px; height: 48px;">
                    <i class="bi bi-envelope-check-fill text-poly fs-4"></i>
                </div>
                <h1 class="auth-title text-dark">Xác Thực OTP</h1>
                <p class="auth-subtitle">
                    Chúng tôi đã gửi mã xác thực tới email<br>
                    <strong class="text-dark" th:text="${session.resetEmail != null ? session.resetEmail : 'của bạn'}">example@fpt.edu.vn</strong>
                </p>
            </div>

            <!-- Hiển thị thông báo -->
            <div th:if="${error}" class="alert-custom alert-error mb-3">
                <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="alert-custom alert-success mb-3">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            </div>

            <form th:action="@{/verify-otp}" method="post">
                <div class="form-group mb-4">
                    <label class="form-label text-center d-block w-100" for="otp">Nhập mã OTP (6 số)</label>
                    <div class="input-wrapper">
                        <i class="bi bi-key input-icon"></i>
                        <input type="text" class="form-control-custom text-center fw-bold fs-5"
                               id="otp" name="otp" placeholder="Trống" maxlength="6" pattern="\d{6}"
                               title="Vui lòng nhập đúng 6 số" required autofocus style="letter-spacing: 4px;">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control-custom"
                               id="newPassword" name="newPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <div class="input-wrapper">
                        <i class="bi bi-check-circle input-icon"></i>
                        <input type="password" class="form-control-custom"
                               id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4" style="font-size: 14px;">
                    <span class="text-muted">Mã hết hạn trong: <strong class="text-poly" id="timer">03:00</strong></span>
                    <!-- Không sử dụng href cho resend, có thể xử lý qua form khác phía sau nếu cần, hiện giữ nguyên theo giao diện -->
                </div>

                <button type="submit" class="btn-submit mb-3">
                    Xác Thực & Cấp Lại Mật Khẩu
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none text-muted" style="font-size: 14px;">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
                </a>
            </div>

        </div>
    </div>

    <!-- Hẹn giờ đơn giản (giao diện) -->
    <script>
        let timeLeft = 180; // 3 phút
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerHTML = "Hết hạn";
                timerElement.classList.replace('text-poly', 'text-danger');
            } else {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerElement.innerHTML = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
                timeLeft--;
            }
        }, 1000);
    </script>

    <!-- Script tạo hiệu ứng nền giống trang Login -->
    <script>
        const canvas = document.getElementById('techCanvas');
        const ctx = canvas.getContext('2d');
        
        let particlesArray = [];
        const techIcons = ['\uF28E', '\uF30C', '\uF288', '\uF2A2', '\uF3E1', '\uF6B0'];
        
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 12;
                this.icon = techIcons[Math.floor(Math.random() * techIcons.length)];
                
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                this.baseOpacity = Math.random() * 0.3 + 0.1;
                this.opacity = this.baseOpacity;
                this.opacityDirection = Math.random() > 0.5 ? 1 : -1;
                this.mass = this.size / 2;
            }

            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = forceDirectionX * force * (this.mass * 0.1);
                        let directionY = forceDirectionY * force * (this.mass * 0.1);

                        this.x += directionX;
                        this.y += directionY;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                this.opacity += 0.002 * this.opacityDirection;
                if (this.opacity >= 0.6) this.opacityDirection = -1;
                if (this.opacity <= 0.1) this.opacityDirection = 1;
            }

            draw() {
                ctx.fillStyle = `rgba(242, 113, 37, ${this.opacity})`;
                ctx.font = `${this.size}px "bootstrap-icons"`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 25000);
            if (numberOfParticles > 60) numberOfParticles = 60;
            if (window.innerWidth <= 768) numberOfParticles = 25; 

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                
                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        let lineOpacity = 0.15 - (distance / 120) * 0.15;
                        ctx.strokeStyle = `rgba(242, 113, 37, ${lineOpacity})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        document.fonts.ready.then(() => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
            animate();
        });
    </script>
</body>
</html>
