<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - PolyHUB</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/client/css/auth.css}">
</head>
<body>

    <canvas id="techCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            
            <div class="text-center mb-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 bg-poly-soft rounded-circle" style="width: 48px; height: 48px;">
                    <i class="bi bi-person-plus-fill text-poly fs-4"></i>
                </div>
                <h1 class="auth-title text-dark">Tạo tài khoản mới</h1>
                <p class="auth-subtitle">Tham gia cộng đồng PolyHUB ngay hôm nay</p>
            </div>

            <div th:if="${param.error}" class="alert-custom alert-error">
                <i class="bi bi-exclamation-circle-fill"></i> Có lỗi xảy ra trong quá trình đăng ký!
            </div>
            <div th:if="${param.success}" class="alert-custom alert-success">
                <i class="bi bi-check-circle-fill"></i> Đăng ký thành công! Hãy đăng nhập.
            </div>

            <form th:action="@{/register}" method="post">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="fullname">Họ và tên</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person-badge input-icon"></i>
                            <input type="text" class="form-control-custom" id="fullname" name="fullname" placeholder="Nhập họ và tên" required autofocus>
                        </div>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="studentId">Mã sinh viên</label>
                        <div class="input-wrapper">
                            <i class="bi bi-card-text input-icon"></i>
                            <input type="text" class="form-control-custom" id="studentId" name="studentId" placeholder="VD: PS12345" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" class="form-control-custom" id="email" name="email" placeholder="Nhập địa chỉ email" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="password">Mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-control-custom pe-5" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="btn-toggle-pass toggle-pw" data-target="#password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="bi bi-shield-lock input-icon"></i>
                            <input type="password" class="form-control-custom pe-5" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                            <button type="button" class="btn-toggle-pass toggle-pw" data-target="#confirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-check custom-check mb-4 mt-2">
                    <input type="checkbox" class="form-check-input shadow-none" id="agree-terms" name="agree-terms" required>
                    <label class="form-check-label" for="agree-terms">
                        Tôi đồng ý với các <a href="#" class="text-poly text-decoration-none fw-medium">Điều khoản & Dịch vụ</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    Đăng ký tài khoản
                </button>
            </form>

            <div class="text-center mt-4 pt-2">
                <span style="font-size: 14px; color: #6B7280;">Đã có tài khoản? </span>
                <a href="/login" class="text-poly text-decoration-none fw-semibold" style="font-size: 14px;">Đăng nhập</a>
            </div>

        </div>
    </div>

    <script>
        const pwToggles = document.querySelectorAll('.toggle-pw');
        pwToggles.forEach(toggle => {
            toggle.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.querySelector(targetId);
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('i').classList.toggle('bi-eye');
                this.querySelector('i').classList.toggle('bi-eye-slash');
            });
        });
    </script>

    <script>
        const canvas = document.getElementById('techCanvas');
        const ctx = canvas.getContext('2d');
        
        let particlesArray = [];
        const techIcons = ['\uF28E', '\uF30C', '\uF288', '\uF2A2', '\uF3E1', '\uF6B0'];
        
        const mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 12;
                this.icon = techIcons[Math.floor(Math.random() * techIcons.length)];
                
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                this.baseOpacity = Math.random() * 0.3 + 0.1;
                this.opacity = this.baseOpacity;
                this.opacityDirection = Math.random() > 0.5 ? 1 : -1;
                this.mass = this.size / 2;
            }

            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = forceDirectionX * force * (this.mass * 0.1);
                        let directionY = forceDirectionY * force * (this.mass * 0.1);

                        this.x += directionX;
                        this.y += directionY;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                this.opacity += 0.002 * this.opacityDirection;
                if (this.opacity >= 0.6) this.opacityDirection = -1;
                if (this.opacity <= 0.1) this.opacityDirection = 1;
            }

            draw() {
                ctx.fillStyle = `rgba(242, 113, 37, ${this.opacity})`;
                ctx.font = `${this.size}px "bootstrap-icons"`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.icon, this.x, this.y);
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 25000);
            
            if (numberOfParticles > 60) numberOfParticles = 60;
            if (window.innerWidth <= 768) numberOfParticles = 25; 

            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>
</body>
</html>
