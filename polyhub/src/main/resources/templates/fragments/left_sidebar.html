<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="left_sidebar(activeMenu)" class="poly-sidebar-left d-none d-lg-block">
         
        <a th:href="@{/profile}" class="poly-nav-item" th:classappend="${activeMenu == 'profile'} ? 'active' : ''">
             <div class="nav-icon-box">
                <img th:src="${currentUser != null and currentUser.avatar != null and currentUser.avatar.startsWith('http') ? currentUser.avatar : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" 
                     onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png';" 
                     class="rounded-circle" width="32" height="32" style="object-fit: cover;">
            </div>
            <span class="nav-text fw-bold" th:text="${currentUser != null ? currentUser.fullname : 'Cá nhân'}"></span>
        </a>

        <a href="/" class="poly-nav-item" th:classappend="${activeMenu == 'home'} ? 'active' : ''">
            <div class="nav-icon-box"><i class="bi bi-house-door-fill icon-grad icon-grad-main"></i></div>
            <span class="nav-text">Trang chủ</span>
        </a>
        
        <a href="/mentors" class="poly-nav-item" th:classappend="${activeMenu == 'mentors'} ? 'active' : ''">
            <div class="nav-icon-box"><i class="bi bi-award-fill icon-grad icon-grad-main"></i></div>
            <span class="nav-text">Poly Mentors</span>
        </a>
        
        <a href="/documents" class="poly-nav-item" th:classappend="${activeMenu == 'documents'} ? 'active' : ''">
            <div class="nav-icon-box"><i class="bi bi-journal-bookmark-fill icon-grad icon-grad-main"></i></div>
            <span class="nav-text">Góc Tài liệu</span>
        </a>

        <div class="sidebar-heading mt-4">PHÍM TẮT & KHÁM PHÁ</div>
        
        <a href="/saved" class="poly-nav-item" th:classappend="${activeMenu == 'saved'} ? 'active' : ''">
            <div class="nav-icon-box"><i class="bi bi-bookmark-fill icon-grad icon-grad-main"></i></div>
            <span class="nav-text">Đã lưu</span>
        </a>

        <div class="sidebar-heading mt-4">TIN NHẮN TRỰC TIẾP</div>
        
        <a href="#" class="poly-nav-item user-msg-item">
            <div class="position-relative me-3">
                <img src="https://i.pinimg.com/1200x/6d/7f/72/6d7f72dc3b314ea337807512a793dabe.jpg" class="rounded-circle shadow-sm" width="32" height="32" style="object-fit: cover;">
                <span class="position-absolute bottom-0 end-0 p-1 bg-success border border-light rounded-circle" style="transform: translate(25%, 25%);"></span>
            </div>
            <span class="nav-text fw-medium">Bảo Châu</span>
            <span class="badge bg-danger ms-auto rounded-pill" style="font-size: 10px;">2</span>
        </a>
        
        <a href="#" class="poly-nav-item user-msg-item">
            <div class="position-relative me-3">
                <img src="https://i.pinimg.com/736x/99/30/d6/9930d6bbdbf74a38687d92b297cee737.jpg" class="rounded-circle shadow-sm" width="32" height="32" style="object-fit: cover;">
            </div>
            <span class="nav-text fw-medium text-muted">Anh Khoa</span>
        </a>
    </div>
</body>
</html>
