<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="poly-header fixed-top d-flex align-items-center px-3 px-md-4">
        <div class="d-flex align-items-center w-100 mx-auto justify-content-between" style="max-width: 1400px;">
            
            <a href="/" class="text-decoration-none d-flex align-items-center me-4">
                <h3 class="mb-0 fw-bold text-poly" style="letter-spacing: -0.5px;">PolyHUB</h3>
            </a>

            <div class="d-flex align-items-center gap-3">
                <button class="btn-icon-circle d-md-none"><i class="bi bi-search fs-5"></i></button>
                
                <div class="dropdown">
                    <button class="btn-icon-circle position-relative shadow-none border-0" 
                            id="notificationDropdown" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false" 
                            data-bs-auto-close="outside">
                        <i class="bi bi-bell-fill fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="margin-top: 8px; margin-left: -8px;"></span>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end poly-noti-dropdown p-0 shadow-lg border-0 mt-2" aria-labelledby="notificationDropdown">
                        <div class="p-3 d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold mb-0" style="font-size: 18px;">Thông Báo</h5>
                            <a href="#" class="text-decoration-none fw-medium" style="color: #F27125; font-size: 13px;">Đánh dấu đã đọc</a>
                        </div>
                        <div class="noti-list" style="max-height: 420px; overflow-y: auto;">
                            <div class="noti-item d-flex gap-3 p-3 position-relative">
                                <img src="https://i.pinimg.com/736x/26/b3/0a/26b30a7f16b20c714d782e60910788ce.jpg" class="rounded-circle" width="45" height="45">
                                <div class="flex-grow-1">
                                    <p class="mb-2" style="font-size: 14px; line-height: 1.4;">
                                        <span class="fw-bold">Nguyễn Thế Trung</span> gửi lời mời tham gia nhóm <span class="fw-bold">Nhóm lập trình game (unity) Nâng cao</span>
                                    </p>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-poly-gradient btn-sm px-3 py-1 fw-bold text-white border-0" style="font-size: 12px; border-radius: 6px;">Chấp nhận</button>
                                        <button class="btn btn-light btn-sm px-3 py-1 fw-bold border" style="font-size: 12px; border-radius: 6px;">Bỏ qua</button>
                                    </div>
                                </div>
                                <div class="d-flex flex-column align-items-end">
                                    <span class="text-muted" style="font-size: 11px;">2p</span>
                                    <div class="bg-primary rounded-circle mt-2" style="width: 8px; height: 8px;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="p-2 border-top d-flex justify-content-between align-items-center px-3">
                            <div class="d-flex align-items-center gap-1" style="font-size: 12px; color: #65676b;">PolyHUB đồng hành cùng bạn</div>
                            <a href="#" class="text-decoration-none fw-bold" style="color: #F27125; font-size: 13px;">Xem tất cả</a>
                        </div>
                    </div>
                </div>
                
                <a th:href="@{/chat}" class="btn-icon-circle text-decoration-none shadow-none border-0 d-flex align-items-center justify-content-center">
                    <i class="bi bi-chat-dots-fill fs-5"></i>
                </a>

                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none border-0 shadow-none" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://i.pinimg.com/736x/26/b3/0a/26b30a7f16b20c714d782e60910788ce.jpg" alt="User" width="38" height="38" class="rounded-circle border border-2 border-white shadow-sm">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="dropdownUser" style="border-radius: 10px;">
                        <li>
                            <a class="dropdown-item py-2 fw-medium d-flex align-items-center" href="/profile">
                                <i class="bi bi-person-circle fs-5 me-2 text-muted"></i> Trang cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2 fw-medium d-flex align-items-center" href="/settings">
                                <i class="bi bi-gear fs-5 me-2 text-muted"></i> Cài đặt & Quyền riêng tư
                            </a>
                        </li>
                        <li><hr class="dropdown-divider opacity-10"></li>
                        <li>
                            <a class="dropdown-item py-2 fw-medium text-danger d-flex align-items-center" href="/logout">
                                <i class="bi bi-box-arrow-right fs-5 me-2"></i> Đăng xuất
                            </a>
                        </li>
                    </ul>
                </div>
            </div> </div>
    </header>
</body>
</html>
