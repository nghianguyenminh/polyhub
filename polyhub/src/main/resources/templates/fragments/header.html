<header th:fragment="header" class="navbar navbar-expand-lg fixed-top bg-white shadow-sm" style="height: 76px;">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-poly d-flex align-items-center" th:href="@{/}">
            <img src="/client/images/logo.png" alt="PolyHUB" width="40" height="40" class="me-2 d-none d-sm-block" onerror="this.style.display='none'">
            PolyHUB
        </a>

        <div class="d-none d-md-flex mx-auto" style="width: 40%;">
            <div class="input-group">
                <span class="input-group-text bg-light border-0 rounded-start-pill text-muted px-3">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control bg-light border-0 rounded-end-pill py-2" placeholder="Tìm kiếm trên PolyHUB...">
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            
            <a href="#" class="position-relative text-dark hover-orange bg-light p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-chat-fill fs-5 text-secondary"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
            </a>

            <a href="#" class="position-relative text-dark hover-orange bg-light p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-bell-fill fs-5 text-secondary"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">
                    3
                </span>
            </a>

            <div class="dropdown ms-2">
                <a href="#" class="d-flex align-items-center text-decoration-none" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://ui-avatars.com/api/?name=Minh+Nghia&background=F27125&color=fff" alt="Avatar" class="rounded-circle border" width="40" height="40">
                    <div class="d-none d-lg-block ms-2 text-dark text-start">
                        <div class="fw-bold" style="font-size: 14px; line-height: 1.2;">Nguyễn Minh Nghĩa</div>
                        <small class="text-muted" style="font-size: 11px;">SV, K21 - CNTT</small>
                    </div>
                </a>
                
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-3 rounded-3" aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item py-2 fw-semibold d-flex align-items-center" href="#">
                            <div class="bg-light p-2 rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                <i class="bi bi-person-fill fs-5 text-secondary"></i>
                            </div>
                            Trang cá nhân
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item py-2 fw-semibold d-flex align-items-center" href="#">
                            <div class="bg-light p-2 rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                <i class="bi bi-gear-fill fs-5 text-secondary"></i>
                            </div>
                            Cài đặt & Quyền riêng tư
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item py-2 fw-semibold text-danger d-flex align-items-center" th:href="@{/login}">
                            <div class="bg-light p-2 rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                <i class="bi bi-box-arrow-right fs-5 text-danger"></i>
                            </div>
                            Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
