<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="poly-header fixed-top d-flex align-items-center px-3 px-md-4">
        <div class="d-flex align-items-center w-100 mx-auto justify-content-between" style="max-width: 1400px;">
            
            <a href="/" class="text-decoration-none d-flex align-items-center me-4">
                <h3 class="mb-0 fw-bold text-poly" style="letter-spacing: -0.5px;">PolyHUB</h3>
            </a>

            <div class="d-flex align-items-center gap-3">
                <button class="btn-icon-circle d-md-none"><i class="bi bi-search fs-5"></i></button>
                
                <div class="dropdown">
                    <button class="btn-icon-circle position-relative shadow-none border-0" 
                            id="notificationDropdown" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false" 
                            data-bs-auto-close="outside">
                        <i class="bi bi-bell-fill fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="margin-top: 8px; margin-left: -8px;"></span>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end poly-noti-dropdown p-0 shadow-lg border-0 mt-2" aria-labelledby="notificationDropdown">
                        <div class="p-3 d-flex justify-content-between align-items-center border-bottom">
                            <h5 class="fw-bold mb-0" style="font-size: 18px;">Thông Báo</h5>
                            <a href="#" class="text-decoration-none fw-medium" style="color: var(--poly-primary); font-size: 13.5px;">Đánh dấu đã đọc</a>
                        </div>
                        <div class="noti-list">
                            <div class="noti-item d-flex gap-2">
                                <img src="https://i.pinimg.com/736x/26/b3/0a/26b30a7f16b20c714d782e60910788ce.jpg" class="rounded-circle" width="56" height="56">
                                <div class="flex-grow-1" style="min-width: 0;">
                                    <p class="mb-1 text-wrap" style="color: var(--text-main);">
                                        <strong style="color: #050505;">Nguyễn Thế Trung</strong> gửi lời mời tham gia nhóm <strong style="color: #050505;">Nhóm lập trình game (unity) Nâng cao</strong>
                                    </p>
                                    <p class="text-primary fw-semibold mb-2" style="font-size: 12.5px;"><i class="bi bi-clock me-1"></i>Vài giây trước</p>
                                    <div class="d-flex gap-2 mt-1">
                                        <button class="btn btn-poly-gradient text-white border-0 py-1 flex-grow-1" style="border-radius: 6px;">Chấp nhận</button>
                                        <button class="btn btn-light fw-bold border py-1 flex-grow-1" style="border-radius: 6px; background: #e4e6eb;">Bỏ qua</button>
                                    </div>
                                </div>
                                <div class="d-flex flex-column align-items-center justify-content-center px-1">
                                    <div class="bg-primary rounded-circle" style="width: 12px; height: 12px; box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);"></div>
                                </div>
                            </div>
                        </div>
                        <div class="p-2 border-top d-flex justify-content-center align-items-center">
                            <a href="#" class="text-decoration-none fw-bold text-center w-100 py-1" style="color: var(--poly-primary); font-size: 14px; transition: 0.2s;">Xem tất cả thông báo</a>
                        </div>
                    </div>
                </div>
                
                <a th:href="@{/chat}" class="btn-icon-circle text-decoration-none shadow-none border-0 d-flex align-items-center justify-content-center">
                    <i class="bi bi-chat-dots-fill fs-5"></i>
                </a>

                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none border-0 shadow-none" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:src="${currentUser != null and currentUser.avatar != null and currentUser.avatar.startsWith('http') ? currentUser.avatar : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png';" alt="User" width="38" height="38" class="rounded-circle border border-2 border-white shadow-sm" style="object-fit: cover;">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="dropdownUser" style="border-radius: 10px;">
                        <li>
                            <a class="dropdown-item py-2 fw-medium d-flex align-items-center" href="/profile">
                                <i class="bi bi-person-circle fs-5 me-2 text-muted"></i> Trang cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2 fw-medium d-flex align-items-center" href="/settings">
                                <i class="bi bi-gear fs-5 me-2 text-muted"></i> Cài đặt & Quyền riêng tư
                            </a>
                        </li>
                        <li><hr class="dropdown-divider opacity-10"></li>
                        <li>
                            <a class="dropdown-item py-2 fw-medium text-danger d-flex align-items-center" href="/logout">
                                <i class="bi bi-box-arrow-right fs-5 me-2"></i> Đăng xuất
                            </a>
                        </li>
                    </ul>
                </div>
            </div> </div>
    </header>
</body>
</html>
