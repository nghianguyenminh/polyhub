<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(customCss, content, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PolyHUB - FPT Polytechnic</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/client/css/style.css}">
    <link rel="stylesheet" th:href="@{/client/css/sidebar.css}">
    
    <th:block th:replace="${customCss} ?: ~{}"></th:block>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-container">
        <main class="w-100 d-flex justify-content-between"> 
            
            <div th:replace="~{fragments/left_sidebar :: left_sidebar(activeMenu)}"></div>

            <div th:replace="${content} ?: ~{}"></div>

            <div th:replace="~{fragments/right_sidebar :: right_sidebar}"></div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
