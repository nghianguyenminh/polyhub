<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PolyHUB - Mạng Xã Hội Học Tập</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 1. Thiết lập biến màu chuẩn FPT PolyHUB */
        :root {
            --poly-orange: #F27125;
            --poly-orange-hover: #d65d1a;
            --poly-bg: #F0F2F5; /* Màu nền xám nhạt của FB/Threads */
        }

        /* 2. Reset chuẩn UI hiện đại */
        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--poly-bg);
            overflow-x: hidden; /* Chống cuộn ngang làm vỡ layout */
        }

        /* 3. Utility Classes dùng chung cho cả dự án */
        .text-poly { color: var(--poly-orange) !important; }
        .bg-poly { background-color: var(--poly-orange) !important; color: white; }
        .btn-poly { background-color: var(--poly-orange); color: white; border: none; font-weight: 500;}
        .btn-poly:hover { background-color: var(--poly-orange-hover); color: white; }
        
        .cursor-pointer { cursor: pointer; }
        .hover-orange:hover { color: var(--poly-orange) !important; transition: 0.2s; }
        
        /* 4. Tùy chỉnh thanh cuộn (Scrollbar) cho mượt như App */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #bcc0c4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a5aa; }

        /* 5. CỰC KỲ QUAN TRỌNG: Đẩy nội dung xuống để không bị Header đè lên */
        main { 
            padding-top: 76px; /* Bằng đúng chiều cao của Sticky Header */
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main layout:fragment="content">
        </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
