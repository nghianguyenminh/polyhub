<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>403 - PolyHUB Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .icon-lock {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .error-message {
            font-size: 1.25rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="bi bi-shield-lock-fill icon-lock"></i>
        <div class="error-code">403</div>
        <div class="error-message">Từ chối truy cập! Bạn không có đủ quyền.</div>
        <p class="text-muted mb-4">Tài khoản của bạn không được cấp quyền để thực hiện hành động này hoặc truy cập trang này.</p>
        <button onclick="window.history.back()" class="btn btn-outline-secondary me-2">Quay lại</button>
        <a href="/admin/dashboard" class="btn btn-primary">Về Trang chủ Admin</a>
    </div>
</body>
</html>
